<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Coloring - 499apps Games</title>
    <meta name="description" content="Paint glossy 3D pictures. No ads, no tracking. Works offline.">
    <meta name="theme-color" content="#1b1740">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Coloring">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="g499-app game-app">
      <h1 class="g499-sr-only">Coloring</h1>
      <div class="game-stage" id="stage"></div>
      <div class="g499-hud" aria-live="polite">
        <span class="g499-hud-pill" aria-label="Paint">
          <span class="game-swatch" id="swatch" aria-hidden="true"></span>
        </span>
        <span class="g499-hud-pill" aria-label="Parts painted">
          <span class="g499-icon" aria-hidden="true"><svg class="g499-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="6.2" r="2.6"/><circle cx="17.5" cy="10.2" r="2.6"/><circle cx="15.4" cy="16.6" r="2.6"/><circle cx="8.6" cy="16.6" r="2.6"/><circle cx="6.5" cy="10.2" r="2.6"/></svg></span>
          <span class="game-hud-value" id="progress">0/10</span>
        </span>
      </div>
    </main>
  </body>
</html>
